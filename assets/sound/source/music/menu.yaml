type: song
title: Niwa (menu)
description: >
  Calm menu loop. D yo pentatonic (D E G A B) with quartal/sus harmony.
  Shakuhachi melody with an echo, koto broken chords, sho pad, wind chimes.
instruments: ../instruments.yaml
tempo: 75            # quarter = 48 ticks, sixteenth = 12 ticks: exact grid
meter: 4/4
budget: 40960

parts:
