  melody: {instrument: shakuhachi, voices: [0], level: 0.9,
           echo: {voice: 1, delay: "8.", level: 0.28, pan: R},
           opl: {echo: null}}
  koto:   {instrument: koto, voices: [2, 3], ring: true, level: 0.75, opl: {voices: [1, 2]}}
