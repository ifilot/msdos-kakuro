type: song
title: Bamboo Rain (in game 2)
description: >
  Warm, flowing alternative puzzle music in 3/4. G yo pentatonic (G A C D E)
  with sus2 / quartal harmony: koto 8th-note arpeggios and a shakuhachi melody
  in duet, wind chimes falling like raindrops, a sho pad in the B section.
instruments: ../instruments.yaml
tempo: 64.2857       # quarter = 56 ticks, eighth = 28, sixteenth = 14: exact grid
meter: 3/4
budget: 40960

