  # opl: overrides for the OPL2 target (9 FM channels: no room for the echo)
  koto:  {instrument: koto, voices: [0, 1], ring: true, level: 0.6}
  flute: {instrument: shakuhachi, voices: [2], level: 0.75,
          echo: {voice: 3, delay: "8", level: 0.3, pan: R}, opl: {echo: null}}
  chime: {instrument: chime, voices: [4], pan: L, level: 0.75, opl: {voices: [3]}}
