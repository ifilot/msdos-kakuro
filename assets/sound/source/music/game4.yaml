type: song
title: Lantern Path (in game 4)
description: >
  The warmest, most melodic alternative. F yo pentatonic (F G Bb C D) with
  sus / quartal chords (F Bb Gm7 C | F Dm Bb C): koto 8th arpeggios, a singing
  shakuhachi melody with echo, gentle walking bass, quiet sho pad, a soft
  shaker-and-woodblock pulse, occasional chimes.
instruments: ../instruments.yaml
tempo: 75            # quarter = 48 ticks, sixteenth = 12: exact grid
meter: 4/4
budget: 40960

parts:
  # opl: overrides for the OPL2 target (9 FM channels: no room for the echo)
  koto:  {instrument: koto, voices: [0, 1], ring: true, level: 0.55}
  flute: {instrument: shakuhachi, voices: [2], level: 0.75,
          echo: {voice: 3, delay: "8.", level: 0.28, pan: R}, opl: {echo: null}}
  bass:  {instrument: bass, voices: [4], level: 0.7, opl: {voices: [3]}}
  pad:   {instrument: sho, voices: [5, 6, 7], level: 0.7, opl: {voices: [4, 5, 6]}}
  perc:  {voices: [8], level: 0.55, opl: {voices: [7]},
          kit: {wb: {instrument: woodblock, note: F5}, sh: {instrument: shaker, note: C7}}}
  chime: {instrument: chime, voices: [9], pan: L, level: 0.7, opl: {voices: [8]}}

